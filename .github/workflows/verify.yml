name: Verify Portrait Library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run generate:portrait-skill
      - run: git diff --exit-code
      - run: npm test
      - run: npm run pack:skill
